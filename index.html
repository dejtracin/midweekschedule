      <label class="field"><span>To</span><input class="input" type="date" data-filter="to" value="${esc(f.to)}"></label>
      <label class="field"><span>Section</span><select class="input" data-filter="section"><option value="">All sections</option>${secOpts}</select></label>
      <label class="field"><span>Assignment type</span><select class="input" data-filter="type"><option value="">All types</option>${typeOpts}</select></label>
    </div>
    <div class="btnrow" style="margin:10px 0"><button class="btn sm" data-action="pfUpcoming">Upcoming only</button><button class="btn sm" data-action="pfReset">Show everything</button>
      <span class="muted" style="font-size:14px">${list.length} assignment${list.length === 1 ? '' : 's'}</span></div>
    ${list.length ? `<div class="rows">${list.map(assignRow).join('')}</div>` : `<div class="empty"><h3>No assignments match these filters</h3><p>Widen the date range or clear a filter.</p></div>`}
    <h2 class="subhead">${f.pub ? `History for ${esc(pname(f.pub))}` : 'Fairness overview'}</h2>
    ${f.pub ? historyForPublisher(f.pub) : fairnessTable()}
  </div>`;
}

/* Per-publisher: last time they handled each assignment type. Based only on saved records. */
function historyForPublisher(pid){
  const p = pub(pid); if (!p) return '';
  const t = todayISO();
  const mine = allAssignments().filter(a => a.pid === pid);
  const types = Array.from(new Set([...p.categories, ...mine.map(a => a.type)])).filter(Boolean);
  if (!types.length) return '<p class="muted">No eligibility or assignments recorded.</p>';
  const rows = types.map(ty => {
    const done = mine.filter(a => a.type === ty && a.date < t);
    const next = mine.find(a => a.type === ty && a.date >= t);
    return `<tr><td>${esc(catName(ty))}${p.categories.includes(ty) ? '' : ' <span class="chip warn">not eligible</span>'}</td>
      <td>${done.length ? esc(fmtShort(done[done.length - 1].date)) : '<span class="muted">Never</span>'}</td>
      <td>${done.length}</td><td>${next ? esc(fmtShort(next.date)) : '—'}</td></tr>`;
  }).join('');
  return `<div class="scroll-x"><table class="tbl"><thead><tr><th>Assignment type</th><th>Last handled</th><th>Times</th><th>Next</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="muted" style="font-size:13px">Counts come only from meetings saved in this app.</p>`;
}

function fairnessTable(){
  if (!state.publishers.length) return '<p class="muted">Add publishers to see the overview.</p>';
  const t = todayISO(), since = toISO(addDays(new Date(), -91));
  const all = allAssignments();
  const rows = state.publishers.map(p => {
    const mine = all.filter(a => a.pid === p.id);
    const past = mine.filter(a => a.date < t);
    return {p, last:past.length ? past[past.length - 1].date : '', recent:past.filter(a => a.date >= since).length, upcoming:mine.filter(a => a.date >= t).length};
  }).sort((a, b) => (a.last || '').localeCompare(b.last || '') || a.p.name.localeCompare(b.p.name));
  return `<p class="muted" style="font-size:14px;margin-top:0">Sorted by who has gone longest without an assignment. Select a publisher in the filter above to see their history by type.</p>
  <div class="scroll-x"><table class="tbl"><thead><tr><th>Publisher</th><th>Last assignment</th><th>Last 13 weeks</th><th>Upcoming</th></tr></thead><tbody>
  ${rows.map(r => `<tr><td><button class="btn ghost sm" style="padding:0;min-height:0;font-weight:600" data-action="pfPub" data-id="${r.p.id}">${esc(r.p.name)}</button></td>
    <td>${r.last ? esc(fmtShort(r.last)) : '<span class="muted">None</span>'}</td><td>${r.recent}</td><td>${r.upcoming}</td></tr>`).join('')}
  </tbody></table></div>`;
}

/* =====================================================================
   3.7 EDITORS (layers, meeting editor, publisher editor)
   ===================================================================== */
const layers = [];
/* Open a modal layer. onDismiss runs on backdrop tap or Escape. */
function openLayer(html, onDismiss){
  const el = document.createElement('div');
  el.className = 'layer';
  el.innerHTML = html;
  el._dismiss = onDismiss || (() => closeLayer(el));
  el.addEventListener('pointerdown', e => { el._down = e.target === el; });
  el.addEventListener('click', e => { if (e.target === el && el._down) el._dismiss(); });
  $('#modalRoot').appendChild(el);
  layers.push(el);
  document.body.classList.add('modal-open');
  return el;
}
function closeLayer(el){
  const i = layers.indexOf(el); if (i >= 0) layers.splice(i, 1);
  el.remove();
  if (!layers.length) document.body.classList.remove('modal-open');
}
/* Promise-based dialog. buttons: [{label, value, cls}] ; message is HTML (escape inputs!). */
function dialog({title, message, buttons}){
  buttons = buttons || [{label:'OK', value:true, cls:'primary'}];
  return new Promise(res => {
    let layer;
    layer = openLayer(`<div class="modal dialog" role="alertdialog" aria-modal="true" aria-label="${esc(title)}">
      <div class="modal-body"><h3>${esc(title)}</h3><div class="dmsg">${message}</div></div>
      <div class="modal-foot">${buttons.map((b, i) => `<button class="btn ${b.cls || ''}" data-di="${i}">${esc(b.label)}</button>`).join('')}</div></div>`,
      () => { closeLayer(layer); res(false); });
    layer.addEventListener('click', e => { const b = e.target.closest('[data-di]'); if (b){ closeLayer(layer); res(buttons[+b.dataset.di].value); } });
    const last = layer.querySelector('[data-di]:last-child'); if (last) last.focus();
  });
}
const confirmDanger = (title, message, okLabel) => dialog({title, message, buttons:[{label:'Cancel', value:false}, {label:okLabel, value:true, cls:'danger solid'}]});

function newMeetingDraft(date){
  const s = state.settings;
  if (!date){
    // next meeting day after the last scheduled meeting, or this week's
    const t = todayISO();
    const later = sortedMeetings().filter(m => m.date >= t);
    let base = later.length ? addDays(parseISO(later[later.length - 1].date), 1) : parseISO(t);
    while (base.getDay() !== s.meetingDay) base = addDays(base, 1);
    date = toISO(base);
  }
  return {id:uid(), date, weekLabel:'', reading:'', time:'', chairman:'', openingPrayer:'', closingPrayer:'',
    secondHall:!!s.secondHallDefault, hall2Counselor:'',
    songs:{opening:'', middle:'', closing:''}, notes:'', parts:clone(s.template).map(p => mergeMinistry({...p, id:uid(), assignee:'', assistant:'', hall2Assignee:'', hall2Assistant:''}))};
}

function openEditor(meeting, isNew){

function renderEditorBody(){

/* ---- Searchable publisher picker ----
   Each publisher <select> in the editor (marked data-search) gets a
   button that opens a panel with a search box. The real <select> stays
   in the page (hidden) and still holds the value, so choosing a name
   just sets it and fires a normal 'change' event. */
const ssNorm = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
function ssParts(text){
  if (text.startsWith('—')) return {name:text.replace(/^—\s*|\s*—$/g, ''), info:'', special:true};
  const i = text.lastIndexOf(' — ');
  return i < 0 ? {name:text, info:''} : {name:text.slice(0, i), info:text.slice(i + 3)};
}
function ssLabel(sel){
  const o = sel.options[sel.selectedIndex];
  if (!o || !o.value) return '<span class="ss-ph">— Unassigned —</span>';
  return esc(ssParts(o.text).name);
}
function enhanceSearchSelects(root){
  root.querySelectorAll('select[data-search]:not(.ss-native)').forEach(sel => {
    sel.classList.add('ss-native'); sel.tabIndex = -1; sel.setAttribute('aria-hidden', 'true');
    const btn = document.createElement('button');
    btn.type = 'button'; btn.className = 'input ss-btn'; btn.setAttribute('aria-haspopup', 'listbox');
    btn.innerHTML = ssLabel(sel);
    btn.addEventListener('click', e => { e.preventDefault(); ssOpen(sel, btn); });
    btn.addEventListener('keydown', e => {
      if (e.key === 'ArrowDown' || e.key === 'Enter' || e.key === ' '){ e.preventDefault(); ssOpen(sel, btn); }
      else if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey){ e.preventDefault(); ssOpen(sel, btn, e.key); }
    });
    sel._ssBtn = btn;
    sel.parentNode.insertBefore(btn, sel);   // before the select, so tapping the label opens it
    sel.parentNode.classList.add('ss-field');
  });
}
let ssCur = null;
function ssClose(focusBtn){
  if (!ssCur) return;
  const {panel, btn} = ssCur; ssCur = null;
  panel.remove(); btn.setAttribute('aria-expanded', 'false');
  if (focusBtn) btn.focus();
}
function ssOpen(sel, btn, firstChar){
  if (ssCur && ssCur.sel === sel){ ssClose(true); return; }
  ssClose();
  const items = [];
  [...sel.children].forEach(c => {
    if (c.tagName === 'OPTGROUP'){ items.push({group:c.label}); [...c.children].forEach(o => items.push({o})); }
    else items.push({o:c});
  });
  const panel = document.createElement('div');
  panel.className = 'ss-panel';
  panel.innerHTML = `<input class="input ss-q" type="search" placeholder="Search name…" autocomplete="off" spellcheck="false" aria-label="Search name">
    <div class="ss-list" role="listbox"></div>`;
  btn.after(panel); btn.setAttribute('aria-expanded', 'true');
  // Size and place the panel so it never sticks out of the editor window
  const box = (btn.closest('.modal-body') || document.body).getBoundingClientRect(), f = btn.parentNode.getBoundingClientRect();
  const w = Math.min(Math.max(f.width, 320), box.width - 16);
  panel.style.width = w + 'px';
  panel.style.left = Math.min(0, (box.right - 8) - (f.left + w)) + 'px';
  const q = panel.querySelector('.ss-q'), list = panel.querySelector('.ss-list');
  let shown = [], active = 0;
  const draw = () => {
    const words = ssNorm(q.value.trim()).split(/\s+/).filter(Boolean);
    shown = []; let html = '', pendingGroup = null;
    items.forEach(it => {
      if (it.group){ pendingGroup = it.group; return; }
      const parts = ssParts(it.o.text), hay = ssNorm(parts.name);
      if (words.length && (parts.special || !words.every(w => hay.includes(w)))) return;
      if (pendingGroup){ html += `<div class="ss-group">${esc(pendingGroup)}</div>`; pendingGroup = null; }
      const i = shown.length; shown.push(it.o);
      html += `<div class="ss-opt${it.o.selected ? ' sel' : ''}${parts.special ? ' special' : ''}" role="option" data-i="${i}" aria-selected="${it.o.selected}">
        <span class="ss-name">${esc(parts.name)}</span>${parts.info ? `<span class="ss-info">${esc(parts.info)}</span>` : ''}</div>`;
    });
    list.innerHTML = html || '<div class="ss-empty">No matching name</div>';
    active = Math.max(0, words.length ? 0 : shown.findIndex(o => o.selected));
    mark();
  };
  const mark = () => {
    list.querySelectorAll('.ss-opt').forEach(el => el.classList.toggle('act', +el.dataset.i === active));
    const a = list.querySelector('.ss-opt.act'); if (a) a.scrollIntoView({block:'nearest'});
  };
  const pick = o => {
    if (!o) return;
    sel.value = o.value; btn.innerHTML = ssLabel(sel);
    ssClose(true);
    sel.dispatchEvent(new Event('change', {bubbles:true}));
  };
  q.addEventListener('input', draw);
  q.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown'){ e.preventDefault(); active = Math.min(shown.length - 1, active + 1); mark(); }
    else if (e.key === 'ArrowUp'){ e.preventDefault(); active = Math.max(0, active - 1); mark(); }
    else if (e.key === 'Enter'){ e.preventDefault(); pick(shown[active]); }
    else if (e.key === 'Escape'){ e.preventDefault(); e.stopPropagation(); ssClose(true); }
    else if (e.key === 'Tab') ssClose();
  });
  list.addEventListener('mousedown', e => e.preventDefault());   // keep focus in the search box
  panel.addEventListener('click', e => e.preventDefault());       // the panel sits inside a <label>: don't let a click re-open it
  list.addEventListener('click', e => { const el = e.target.closest('.ss-opt'); if (el) pick(shown[+el.dataset.i]); });
  ssCur = {sel, btn, panel};
  if (firstChar) q.value = firstChar;
  draw();
  q.focus({preventScroll:true});
  requestAnimationFrame(() => panel.scrollIntoView({block:'nearest', inline:'nearest', behavior:'smooth'}));
}
document.addEventListener('mousedown', e => { if (ssCur && !ssCur.panel.contains(e.target) && e.target !== ssCur.btn && !ssCur.btn.contains(e.target)) ssClose(); }, true);
document.addEventListener('touchstart', e => { if (ssCur && !ssCur.panel.contains(e.target) && !ssCur.btn.contains(e.target)) ssClose(); }, {capture:true, passive:true});


/* Publisher <option>s for a role. Eligible publishers first, sorted by
   who has waited longest for that type; ineligible ones only when
   "show everyone" is on (or already selected). Nothing is auto-assigned. */
function pubOptions(selected, cat, brothersOnly, allowNone, allowChair){
  const lm = ed ? ed.lastMap : {};
  // Living as Christians parts: sisters are never listed
  const list = state.publishers.filter(p => !brothersOnly || p.gender !== 'F' || p.id === selected).sort(byName);
  const label = (p, warn) => {
    const last = cat ? lm[p.id + '|' + cat] : lm[p.id];
    const info = last ? ` — last ${fmtMD(last)}` : ' — never';
    return `<option value="${p.id}" ${p.id === selected ? 'selected' : ''}>${esc(p.name)}${warn ? ' (not marked eligible)' : ''}${info}</option>`;
  };
  const elig = cat ? list.filter(p => p.categories.includes(cat)) : list;
  elig.sort((a, b) => (lm[a.id + '|' + cat] || '').localeCompare(lm[b.id + '|' + cat] || '') || a.name.localeCompare(b.name));
  let out = '<option value="">— Unassigned —</option>'
    + (allowChair ? `<option value="${CHAIR}" ${selected === CHAIR ? 'selected' : ''}>Chairman</option>` : '')
    + (allowNone ? `<option value="${NONE}" ${selected === NONE ? 'selected' : ''}>Not needed</option>` : '')
    + elig.map(p => label(p)).join('');
  if (cat){
    const others = list.filter(p => !p.categories.includes(cat) && (ed.showAll || p.id === selected));
    if (others.length) out += `<optgroup label="Not marked eligible">${others.map(p => label(p, true)).join('')}</optgroup>`;
  }
  if (selected && selected !== NONE && selected !== CHAIR && !pub(selected)) out += `<option value="${esc(selected)}" selected>${esc(pname(selected))}</option>`;
  return out;
}

/* ---- Part cards in the meeting editor ----
   Details on the left, assigned publishers on the right.

function remarkCardHTML(p){

const inputField = (p, f, label, ph = '') => `<label class="field"><span>${label}</span><input class="input" data-ped="${f}" data-pid="${p.id}" value="${esc(p[f])}" placeholder="${esc(ph)}" maxlength="300"></label>`;
const fieldMinutes = p => `<label class="field"><span>Minutes</span><input class="input" type="number" inputmode="numeric" min="0" max="180" data-ped="duration" data-pid="${p.id}" value="${p.duration}"></label>`;
function partCardHTML(p, sec, num, movable){
  const i = movable.indexOf(p);
  const brothers = sec === 'living';
  const h2on = usesHall2(ed.draft, p);
  const controls = sec === 'treasures' ? '' : `
    <button class="btn icon sm" data-action="edMove" data-pid="${p.id}" data-dir="-1" aria-label="Move up" ${i === 0 ? 'disabled' : ''}>${ICON.up}</button>
    <button class="btn icon sm" data-action="edMove" data-pid="${p.id}" data-dir="1" aria-label="Move down" ${i === movable.length - 1 ? 'disabled' : ''}>${ICON.down}</button>
    <button class="btn icon sm danger" data-action="edDelPart" data-pid="${p.id}" aria-label="Remove part">${ICON.x}</button>`;

  // Left column: part details
  let left;
  if (sec === 'treasures'){
    // The talk and Espirituwal nga mga Bahandi have no notes field
    left = `<div class="field"><span>Length</span><div class="fixedval">${p.duration} min.</div></div>`
      + (['treasures', 'gems'].includes(p.type) ? '' : inputField(p, 'notes', 'Notes / material'));
  } else if (sec === 'ministry'){
    left = fieldMinutes(p)
      + `<label class="field"><span>Setting, theme &amp; counsel point</span><textarea class="input details" data-ped="theme" data-pid="${p.id}" maxlength="400"
          placeholder="e.g. PAGPAMALAYBALAY. … (lmd leksiyon 7 punto 4)">${esc(p.theme)}</textarea></label>
         <div class="muted" style="font-size:12px;line-height:1.3">Start with “PAKIGPULONG.” for a talk (no assistant).</div>`;
  } else {
    left = fieldMinutes(p) + inputField(p, 'notes', 'Notes / material');
  }

  // Right column: assigned publishers
  const showAsst = needsAssistant(p) || p.assistant;
  const sel = (f, cat, label, onlyBrothers) => `<label class="field"><span>${label}</span><select class="input" data-search data-ped="${f}" data-pid="${p.id}">${pubOptions(p[f], cat, onlyBrothers, true)}</select></label>`;
  const mainSel = sel('assignee', p.type, h2on ? 'Assigned to' : (brothers ? 'Assigned to (brothers)' : 'Assigned to'), brothers)
    + (showAsst ? sel('assistant', asstCat(p), asstLabel(p), brothers) : '');
  let right = mainSel;
  if (h2on){
    // Each hall in its own colored group with a bold colored title
    right = `<div class="hallgrp main"><b class="hall-t">Main hall</b>${mainSel}</div>
      <div class="hallgrp second"><b class="hall-t">Second hall</b>${sel('hall2Assignee', p.type, 'Assigned to')}
      ${showAsst || p.hall2Assistant ? sel('hall2Assistant', asstCat(p), asstLabel(p)) : ''}</div>`;
  }
  return `<div class="pcard s-${sec}">
    <div class="phead"><span class="num">${num}.</span>
      ${['gems', 'reading'].includes(p.type) && sec === 'treasures'
        ? `<div class="fixedtitle">${esc(p.title)}</div>`   /* fixed titles: Espirituwal nga mga Bahandi, Pagbasa sa Bibliya */
        : `<input class="input" data-ped="title" data-pid="${p.id}" value="${esc(p.title)}" aria-label="Part title" maxlength="120">`}${controls}
    </div>
    <div class="pcols"><div class="lcol">${left}</div><div class="rcol">${right}</div></div></div>`;
}

/* Congregation Bible Study card: fixed title and length, an on/off switch,
   and only notes, conductor and reader editable. */
function cbsCardHTML(p, num){
  const sw = `<label class="switch" title="Include this part"><input type="checkbox" data-ped="active" data-pid="${p.id}" ${p.off ? '' : 'checked'}><span></span></label>`;

/* Field edits inside the editor. Structural changes re-render the body. */
/* The Type field is no longer shown for ministry parts. The assignment
   type (used for eligibility and history) is worked out from the part
   title, e.g. "Following Up" -> "Following Up (Return Visit)". */
function ministryTypeFor(p){
  const t = p.title.trim().toLowerCase();
  const skip = ['chairman','prayer','assistant','cbs','cbsreader','counselor','treasures','gems','reading','living','localneeds'];
  const hit = t && state.settings.categories.find(c => {
    if (skip.includes(c.id)) return false;
    const n = c.name.toLowerCase(), base = n.replace(/\s*\(.*\)\s*$/, '');
    return n === t || base === t || t.includes(base) || (t.length >= 6 && base.startsWith(t));
  });
  if (hit) return hit.id;
  if (isTalk(p)) return 'studenttalk';
  return skip.includes(p.type) ? '' : p.type;
}
function onEditorField(t, isChange){
  const d = ed.draft;
  if (t.dataset.ed !== undefined){
    const f = t.dataset.ed;
    if (f.startsWith('song.')) d.songs[f.slice(5)] = songVal(t.value);
    else if (t.type === 'checkbox') d[f] = t.checked;
    else d[f] = t.value;
    if ((f === 'date' && isChange && parseISO(t.value)) || (f === 'secondHall' && isChange)) renderEditorBody(); else updateEdLive();
    return;
  }
  const p = d.parts.find(x => x.id === t.dataset.pid); if (!p) return;
  const f = t.dataset.ped;
  if (f === 'active'){ p.off = !t.checked; if (isChange) renderEditorBody(); return; }
  p[f] = f === 'duration' ? int(t.value, 0, 180, 0) : t.value;
  if (p.section === 'ministry' && (f === 'title' || f === 'theme')) p.type = ministryTypeFor(p);
  if (p.section === 'ministry' && f === 'theme' && isChange){
    // A talk has no householder/assistant: clear any that were set.
    if (!needsAssistant(p) && (p.assistant || p.hall2Assistant)){ p.assistant = ''; p.hall2Assistant = ''; toast('Assistant removed — a talk has no assistant'); }
    // Show/hide the assistant fields only if that actually changed
    const card = t.closest('.pcard');
    if (card && !!card.querySelector('[data-ped=assistant]') !== needsAssistant(p)) renderEditorBody();
  }
  if (isChange && ['type', 'format', 'section'].includes(f)){
    if (f === 'section'){ d.parts = d.parts.filter(x => x !== p).concat([p]); d.parts = orderedParts(d.parts); }
    renderEditorBody();
  } else updateEdLive();
}

async function edSave(){
  const d = ed.draft;
  if (!parseISO(d.date)) return toast('Enter a valid meeting date before saving.', 'error');
  if (d.parts.some(p => !p.title.trim())) return toast('Every part needs a title.', 'error');
  if (state.meetings.some(m => m.id !== d.id && m.date === d.date)){
    const ok = await dialog({title:'Date already used', message:`<p>Another meeting is already scheduled on ${esc(fmtLong(d.date))}. Save anyway?</p>`,
      buttons:[{label:'Go back', value:false}, {label:'Save anyway', value:true, cls:'primary'}]});
    if (!ok) return;
  }
  d.parts = orderedParts(d.parts).map(p => ({...p, title:p.title.trim()}));
  if (!d.secondHall){ d.hall2Counselor = ''; d.parts.forEach(p => { p.hall2Assignee = ''; p.hall2Assistant = ''; }); }
  const i = state.meetings.findIndex(m => m.id === d.id);
  if (i >= 0) state.meetings[i] = clone(d); else state.meetings.push(clone(d));
  save(ed.isNew ? 'Meeting added' : 'Meeting saved');
  ui.weekCursor = toISO(weekStartOf(parseISO(d.date)));
  closeLayer(ed.layer); ed = null;
  render();
}
async function edCancel(){
  if (!ed) return;
  if (JSON.stringify(ed.draft) !== ed.orig){
    const ok = await dialog({title:'Discard changes?', message:'<p>Your changes to this meeting have not been saved.</p>',
      buttons:[{label:'Keep editing', value:false}, {label:'Discard', value:true, cls:'danger solid'}]});
    if (!ok) return;
  }
  closeLayer(ed.layer); ed = null;
}

async function deletePublisher(id){
  const p = pub(id); if (!p) return;
  const t = todayISO();
  const upcoming = allAssignments().filter(a => a.pid === id && a.date >= t);
  let msg = `<p>Remove <b>${esc(p.name)}</b> from the directory?</p>`;
  if (upcoming.length){
    msg += `<div class="notice conflict"><p><b>${upcoming.length} upcoming assignment${upcoming.length > 1 ? 's' : ''} will become unassigned:</b></p><ul>${upcoming.map(a => `<li>${esc(fmtShort(a.date))} — ${esc(a.label)}</li>`).join('')}</ul></div>`;
  }
  msg += `<p class="muted" style="margin-top:8px">Past assignments stay in the history, marked “removed”.</p>`;
  if (!(await confirmDanger('Delete publisher?', msg, upcoming.length ? 'Delete and unassign' : 'Delete'))) return;
  state.removed[id] = p.name;
  state.publishers = state.publishers.filter(x => x.id !== id);
  state.meetings.forEach(m => {
    if (m.date < t) return;
    ['chairman', 'openingPrayer', 'closingPrayer'].forEach(k => { if (m[k] === id) m[k] = ''; });
    if (m.hall2Counselor === id) m.hall2Counselor = '';
    m.parts.forEach(x => ['assignee', 'assistant', 'hall2Assignee', 'hall2Assistant'].forEach(k => { if (x[k] === id) x[k] = ''; }));
  });
  if (ui.pubViewId === id) ui.pubViewId = '';
  if (ui.pf.pub === id) ui.pf.pub = '';
  save('Publisher deleted'); render();
}

async function duplicateMeeting(id){
  const m = state.meetings.find(x => x.id === id); if (!m) return;
  const keep = await dialog({title:'Duplicate meeting', message:`<p>Create a copy of ${esc(weekLabel(m))} for the following free week?</p><p class="muted">Choose whether to copy the assigned names or only the parts.</p>`,
    buttons:[{label:'Cancel', value:false}, {label:'Parts only', value:'parts'}, {label:'Parts and names', value:'all', cls:'primary'}]});
  if (!keep) return;
  let d = addDays(parseISO(m.date), 7);
  while (state.meetings.some(x => x.date === toISO(d))) d = addDays(d, 7);
  const c = clone(m);
  c.id = uid(); c.date = toISO(d); c.weekLabel = ''; c.notes = m.notes;
  c.parts.forEach(p => { p.id = uid(); if (keep === 'parts'){ p.assignee = ''; p.assistant = ''; p.hall2Assignee = ''; p.hall2Assistant = ''; } });
  if (keep === 'parts') c.hall2Counselor = '';
  if (keep === 'parts'){ c.chairman = ''; c.openingPrayer = ''; c.closingPrayer = ''; }
  openEditor(c, true);
  toast('Copy created — review and save it');
}

function meetingText(m){
  const L = [];
  L.push(`${state.settings.congName} — Christian Life and Ministry Meeting`);
  L.push(`${weekLabel(m)} · ${fmtLong(m.date)}, ${fmtTime(meetingTime(m))}`);
  if (m.reading) L.push(`Bible reading: ${m.reading}`);
  L.push(`Chairman: ${pname(m.chairman) || '—'}`);
  if (m.secondHall) L.push(`Second hall counselor: ${pname(m.hall2Counselor) || '—'}`);
  programRows(m).forEach(r => {
    if (r.kind === 'song'){
      if (!r.role){ L.push(songTxt(r.song)); return; }
      if (r.closing) L.push('');
      L.push(`${songTxt(r.song)} ug Pag-ampo — ${r.chair ? 'Chairman' : (pname(r.pid) || '—')}`);
      if (r.remark) L.push(`${r.remark.title} (${r.remark.duration} min.)`);
    } else if (r.kind === 'section'){ L.push(''); L.push(r.sec.name.toUpperCase()); }
    else if (r.kind === 'remark') L.push(`${r.part.title} (${r.part.duration} min.)`);
    else {
      const p = r.part;
      L.push(`${r.n}. ${p.title} (${p.duration} min.)${p.section === 'ministry' && p.format ? ' ' + p.format.toUpperCase() + '.' : ''}${p.theme ? ' ' + p.theme : ''}${p.assignee === NONE ? '' : ` — ${pname(p.assignee) || '—'}`}${realId(p.assistant) ? ` / ${asstLabel(p)}: ${pname(p.assistant)}` : ''}`);
      if (usesHall2(m, p) && p.hall2Assignee !== NONE) L.push(`   Second hall: ${pname(p.hall2Assignee) || '—'}${p.hall2Assistant ? ` / ${asstLabel(p)}: ${pname(p.hall2Assistant)}` : ''}`);
      if (p.notes) L.push(`   ${p.notes}`);
    }
  });
  if (m.notes){ L.push(''); L.push(`Notes: ${m.notes}`); }
  return L.join('\n');
}

async function copyText(text){
  try { if (navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(text); return true; } } catch (e) {}
  // Fallback for file:// and older browsers
  const ta = document.createElement('textarea');
  ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
  let ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
  ta.remove();
  return ok;
}
function showTextForManualCopy(text){
  dialog({title:'Copy this text', message:`<p class="muted">Automatic copying isn’t available here. Select the text and copy it.</p><textarea class="input" style="min-height:240px;font-size:14px" readonly>${esc(text)}</textarea>`});
}

function download(filename, text, mime){
  const blob = new Blob([text], {type:mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

function exportCSV(){
  const cols = ['Date','Day','Week','Section','Order','Part','Assignment type','Format','Setting / theme / counsel point','Minutes','Participant','Assistant / Reader','Second hall participant','Second hall assistant','Counsel point / notes','Meeting notes'];

    lines.push(row({...base, Section:'Meeting', Part:'Chairman', 'Assignment type':catName('chairman'), Participant:pname(m.chairman), 'Meeting notes':m.notes}));
    if (m.secondHall) lines.push(row({...base, Section:'Meeting', Part:'Second hall counselor', 'Assignment type':catName('counselor'), Participant:pname(m.hall2Counselor)}));
    lines.push(row({...base, Section:'Meeting', Part:`Awit ${m.songs.opening || ''} ug Pag-ampo`, 'Assignment type':catName('prayer'), Participant:prayerName(m, m.openingPrayer)}));
    orderedParts(activeParts(m.parts)).forEach((p, i) => lines.push(row({...base, Section:secName(p.section), Order:i + 1, Part:p.title,
      'Assignment type':catName(p.type), Format:p.format, 'Setting / theme / counsel point':p.theme, Minutes:p.duration,
      Participant:pname(p.assignee) || (isRemarks(p) ? pname(m.chairman) : ''), 'Assistant / Reader':pname(p.assistant),
      'Second hall participant':usesHall2(m, p) ? pname(p.hall2Assignee) : '', 'Second hall assistant':usesHall2(m, p) ? pname(p.hall2Assistant) : '',
      'Counsel point / notes':p.notes})));
    if (m.songs.middle) lines.push(row({...base, Section:secName('living'), Part:`Awit ${m.songs.middle}`}));
    lines.push(row({...base, Section:'Meeting', Part:`Awit ${m.songs.closing || ''} ug Pag-ampo`, 'Assignment type':catName('prayer'), Participant:prayerName(m, m.closingPrayer)}));
  });
  download(`clm-schedule-${todayISO()}.csv`, '\ufeff' + lines.map(r => r.map(csvEscape).join(',')).join('\r\n'), 'text/csv;charset=utf-8');
  toast('Schedule exported as CSV');
}

function readFileText(file){
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsText(file); });
}
async function importBackup(file){
  if (!file) return;
  const fail = msg => dialog({title:'Import failed', message:`<p>${esc(msg)}</p><p class="muted">Your current data has not been changed.</p>`});
  if (file.size > 15e6) return fail('That file is too large to be a backup from this app.');
  let text; try { text = await readFileText(file); } catch (e) { return fail('The file could not be read.'); }
  let raw; try { raw = JSON.parse(text); } catch (e) { return fail('This file is not a valid JSON backup. Choose a .json file exported from this app.'); }
  let clean; try { clean = validateData(raw); } catch (e) { return fail(e.message); }
  const when = raw.exportedAt && !isNaN(new Date(raw.exportedAt)) ? ` exported ${new Date(raw.exportedAt).toLocaleString()}` : '';
  const ok = await confirmDanger('Replace current data?',
    `<p>The backup${esc(when)} contains <b>${clean.meetings.length}</b> meetings and <b>${clean.publishers.length}</b> publishers for <b>${esc(clean.settings.congName)}</b>.</p>
     <p>Importing will <b>replace</b> everything on this device (${state.meetings.length} meetings, ${state.publishers.length} publishers). A copy of the current data is kept so you can undo from Settings.</p>`, 'Replace data');
  if (!ok) return;
  try { localStorage.setItem(PREV_KEY, JSON.stringify(state)); } catch (e) {}
  state = clean; applyTheme(); save('Backup imported'); render();
}

/* Shrink an uploaded logo to 128px so it fits comfortably in storage. */
function loadLogo(file){
  if (!file) return;
  if (!/^image\//.test(file.type)) return toast('Choose an image file for the logo.', 'error');
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas'); const size = 128; c.width = c.height = size;
      const s = Math.min(img.width, img.height);
      c.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size);
      state.settings.logoImage = c.toDataURL('image/png'); save('Logo saved'); render();
    };
    img.onerror = () => toast('That image could not be read.', 'error');
    img.src = r.result;
  };
  r.readAsDataURL(file);
}

function applyTheme(){
  const t = state.settings.theme;
  const dark = t === 'dark' || (t === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  const meta = document.querySelector('meta[name=theme-color]'); if (meta) meta.content = dark ? '#17191c' : '#ffffff';
}

let toastTimer;
function toast(msg, kind){
  const el = $('#toast'); if (!el) return;
  el.textContent = msg; el.className = 'show' + (kind === 'error' ? ' error' : '');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.className = ''; }, kind === 'error' ? 4500 : 2400);
}

/* Text/select input handling (delegated). */
function onField(e){
  const t = e.target, isChange = e.type === 'change';
  if (ed && (t.dataset.ed !== undefined || t.dataset.ped !== undefined)) return onEditorField(t, isChange);
  // Search boxes update on typing only; ignoring 'change' (fired on blur)
  // prevents the result list re-rendering under the user's finger.
  if ((t.id === 'listSearch' || t.id === 'pubSearch') && isChange) return;
  if (t.id === 'listSearch'){ ui.listSearch = t.value; $('#listResults').innerHTML = listResultsHTML(); return; }
  if (t.id === 'pubSearch'){ ui.pubSearch = t.value; $('#pubResults').innerHTML = pubResultsHTML(); return; }
  if (!isChange) return;
  if (t.id === 'listPast'){ ui.listPast = t.checked; $('#listResults').innerHTML = listResultsHTML(); return; }
  if (t.id === 'pubCat'){ ui.pubCat = t.value; $('#pubResults').innerHTML = pubResultsHTML(); return; }
  if (t.dataset.slip){ t.checked ? ui.slipOff.delete(t.dataset.slip) : ui.slipOff.add(t.dataset.slip); render(); return; }
  if (t.id === 'pubViewSel'){ ui.pubViewId = t.value; render(); return; }
  if (t.dataset.filter){ ui.pf[t.dataset.filter] = t.value; render(); return; }
  if (t.dataset.set){
    const k = t.dataset.set, s = state.settings, v = t.value;
    if (k === 'congName'){ if (!v.trim()) { toast('The congregation name can’t be empty.', 'error'); t.value = s.congName; return; } s.congName = v.trim(); }
    else if (k === 'logoText') s.logoText = v.trim().slice(0, 4).toUpperCase();
    else if (k === 'secondHallDefault') s.secondHallDefault = t.checked;
    else if (k === 'slipCopies') s.slipCopies = t.checked;
    else if (k === 'meetingDay' || k === 'weekStart') s[k] = int(v, 0, 6, s[k]);
    else if (k === 'meetingTime'){ if (!/^\d{2}:\d{2}$/.test(v)) { toast('Enter a valid time.', 'error'); return; } s.meetingTime = v; }
    else if (k === 'duration'){ const n = int(v, 10, 300, null); if (n === null) { toast('Meeting length must be 10–300 minutes.', 'error'); t.value = s.duration; return; } s.duration = n; }
    if (k === 'weekStart') ui.weekCursor = '';
    save('Settings saved'); render(); return;
  }
  if (t.dataset.tpl){
    const p = state.settings.template[+t.dataset.i]; if (!p) return;
    const f = t.dataset.tpl;
    if (f === 'title'){ if (!t.value.trim()) { toast('Part titles can’t be empty.', 'error'); t.value = p.title; return; } p.title = t.value.trim(); }
    else if (f === 'duration') p.duration = int(t.value, 0, 180, 0);
    else p[f] = t.value;
    if (f === 'section') state.settings.template = orderedParts(state.settings.template);
    save('Template saved'); if (f === 'section') $('#tplList').innerHTML = templateHTML(); return;
  }
  if (t.dataset.cat !== undefined){
    const c = state.settings.categories[+t.dataset.cat]; if (!c) return;
    if (!t.value.trim()) { toast('Category names can’t be empty.', 'error'); t.value = c.name; return; }
    c.name = t.value.trim(); save('Category renamed'); return;
  }
}
